name: CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "release/**"
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装前端依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type Check
        run: npm run check
      - name: Frontend Tests
        run: npm run test:run

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff
        run: python -m ruff check api tests
      - name: Pytest
        run: python -m pytest
